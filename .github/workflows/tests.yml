name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gemini_test
          POSTGRES_PASSWORD: gemini_test
          POSTGRES_DB: gemini_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U gemini_test -d gemini_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # MinIO runs as a step, not a service: the docker.io/minio/* repos were
      # removed upstream, and the quay.io image needs a `server /data`
      # command, which service containers cannot pass.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 19000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:19000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Initialize test database schema
        env:
          PGPASSWORD: gemini_test
        run: psql -h localhost -p 15432 -U gemini_test -d gemini_test -f tests/init_sql/01_init.sql

      - name: Run integration tests
        env:
          GEMINI_TEST_DB_HOST: localhost
          GEMINI_TEST_DB_PORT: "15432"
          GEMINI_TEST_STORAGE_HOST: localhost
          GEMINI_TEST_STORAGE_PORT: "19000"
          GEMINI_TEST_LOGGER_HOST: localhost
          GEMINI_TEST_LOGGER_PORT: "16379"
        run: pytest tests/integration/ -v --tb=short
